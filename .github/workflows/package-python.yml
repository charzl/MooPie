name: Package Python macOS client
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a new build even if this SDK/OpenD pair was published'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: package-python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    name: Detect official SDK and OpenD releases
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      tag: ${{ steps.resolve.outputs.tag }}
      sdk: ${{ steps.resolve.outputs.sdk }}
      opend: ${{ steps.resolve.outputs.opend }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test upstream resolution policies
        run: |
          python3 -m unittest discover -s tests/unit -p test_upstream_resolution.py -v
          python3 -m unittest discover -s tests/unit -p test_release_publication.py -v
          python3 -m unittest discover -s tests/unit -p test_lightweight_packaging.py -v
      - name: Resolve Python SDK and OpenD versions
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_BUILD: ${{ inputs.force || false }}
        run: |
          flags=()
          if [[ "$EVENT_NAME" != "pull_request" ]]; then flags+=(--latest --skip-published); fi
          if [[ "$FORCE_BUILD" == "true" ]]; then flags+=(--force); fi
          python3 scripts/resolve-upstream.py artifacts/resolved-build.json "${flags[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.resolve.outputs.build == 'true'
        with:
          name: resolved-build
          path: artifacts/resolved-build.json
          if-no-files-found: error
          retention-days: 14
  python:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    name: MooPie (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MOOMOO_BUILD_MANIFEST: ${{ github.workspace }}/artifacts/resolved-build.json
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: resolved-build
          path: artifacts
      - name: Apply resolved dependency versions
        run: python3 scripts/apply-build-manifest.py artifacts/resolved-build.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/python/requirements*.txt
      - name: Install dependencies
        run: python3 -m pip install -r apps/python/requirements-build.txt
      - name: Unit tests
        working-directory: apps/python
        run: python3 -m unittest discover -s tests/unit -v
      - name: Official SDK and UI integration tests
        working-directory: apps/python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests/integration -v
      - name: OpenD updater tests
        run: swift test --package-path runtime
      - name: Package application
        run: apps/python/scripts/build-app.sh
      - name: Validate lightweight app and independent OpenD installation
        run: |
          mkdir -p artifacts
          python3 scripts/smoke-app.py apps/python/dist/MooPie.app artifacts/MooPie-preview.png
          python3 scripts/smoke-opend.py apps/python/dist/MooPie.app artifacts/python-opend-smoke.json
          python3 scripts/build-metrics.py apps/python/dist/MooPie.app > artifacts/python-build.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MooPie-macos-arm64
          path: |
            apps/python/dist/*.dmg
            apps/python/dist/*.validation.json
            artifacts/python-build.json
            artifacts/*-preview.png
            artifacts/*-opend-smoke.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    name: Publish verified Python DMG installer
    needs: [resolve, python]
    if: needs.resolve.outputs.build == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: MooPie-macos-arm64
          path: artifacts/release
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: resolved-build
          path: artifacts/release
      - name: Publish Python installer after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py artifacts/release
