name: Validate and package rule engine
on:
  push:
    branches: [main]
    paths:
      - 'modules/rule-engine/**'
      - '.github/workflows/rule-engine.yml'
  pull_request:
    paths:
      - 'modules/rule-engine/**'
      - '.github/workflows/rule-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install standalone engine
        run: python -m pip install ./modules/rule-engine
      - name: Test indicators, rule policies and JSON interface
        run: python -m unittest discover -s modules/rule-engine/tests -v
      - name: Build independent distribution
        run: |
          python -m pip install build
          python -m build modules/rule-engine
      - name: Test installed wheel and example scan
        run: |
          python -m venv /tmp/moo-rules-wheel
          /tmp/moo-rules-wheel/bin/pip install modules/rule-engine/dist/*.whl
          /tmp/moo-rules-wheel/bin/python -m unittest discover -s modules/rule-engine/tests -v
          /tmp/moo-rules-wheel/bin/moomoo-scan modules/rule-engine/examples/daily-bars.json --output /tmp/report.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rule-engine-python-${{ matrix.python }}
          path: modules/rule-engine/dist/*
          if-no-files-found: error
