name: Client platform CI
on:
  pull_request:
    paths: ['setup.*', 'moomoo*', 'apps/python/**', 'modules/put-screener/**', 'tests/unit/test_setup_*.py', 'scripts/ci-platform.py', '.github/workflows/client-platforms.yml']
  push:
    branches: [main]
    paths: ['setup.*', 'moomoo*', 'apps/python/**', 'modules/put-screener/**', 'tests/unit/test_setup_*.py', 'scripts/ci-platform.py', '.github/workflows/client-platforms.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    name: ${{ matrix.platform }} / install, test and wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS
            python: apps/python/.venv/bin/python
          - os: windows-latest
            platform: Windows
            python: apps/python/.venv/Scripts/python.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install uv
        run: python -m pip install uv
      - name: Install on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ./setup.sh
      - name: Install on Windows
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1
      - name: Verify install and platform commands without Qt
        env:
          PYTHONUTF8: '1'
        run: '& "${{ matrix.python }}" scripts/ci-platform.py'
      - name: Build Python wheel
        run: uv build --python "${{ matrix.python }}" --no-build-isolation --wheel apps/python --out-dir artifacts/platform-wheel
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: moomoo-tools-${{ matrix.platform }}
          path: |
            artifacts/platform-wheel/*.whl
            artifacts/platform-check/report.json
          if-no-files-found: error
          retention-days: 14
