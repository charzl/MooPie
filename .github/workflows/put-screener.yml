name: Validate standalone put rules
on:
  push:
    branches: [main]
    paths: ['modules/put-screener/**', 'scripts/collect-put-data.py', 'apps/python/moopython/market_collection.py', '.github/workflows/put-screener.yml']
  pull_request:
    paths: ['modules/put-screener/**', 'scripts/collect-put-data.py', 'apps/python/moopython/market_collection.py', '.github/workflows/put-screener.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Test standalone rules and collector contracts
        run: python -m unittest discover -s modules/put-screener/tests -v
      - name: Run isolated single-file example without third-party packages
        run: |
          python -I modules/put-screener/put_rules.py modules/put-screener/example.json --output /tmp/put-report.json --csv-output /tmp/put-report.csv
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: standalone-put-rules
          path: |
            modules/put-screener/put_rules.py
            modules/put-screener/example.json
            modules/put-screener/README.md
          if-no-files-found: error
