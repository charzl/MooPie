name: Package macOS clients
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python + Qt (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/python/requirements*.txt
      - name: Install dependencies
        run: python3 -m pip install -r apps/python/requirements-build.txt
      - name: Unit tests
        working-directory: apps/python
        run: python3 -m unittest discover -s tests/unit -v
      - name: Official SDK and UI integration tests
        working-directory: apps/python
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests/integration -v
      - name: OpenD updater tests
        run: swift test --package-path runtime
      - name: Real official OpenD download and update acceptance
        env:
          MOOMOO_OPEND_UPDATE_ACCEPTANCE: '1'
        run: swift test --package-path runtime --filter UpdateAcceptanceTests
      - name: Package application
        run: apps/python/scripts/build-app.sh
      - name: Smoke test packaged app
        run: |
          mkdir -p artifacts
          python3 scripts/smoke-app.py apps/python/dist/MooPython.app artifacts/MooPython-preview.png
          python3 scripts/smoke-opend.py apps/python/dist/MooPython.app artifacts/python-opend-smoke.json
          python3 scripts/build-metrics.py apps/python/dist/MooPython.app > artifacts/python-build.json
      - name: Benchmark packaged app (three trials)
        run: python3 scripts/benchmark-app.py apps/python/dist/MooPython.app artifacts/python-benchmark.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MooPython-macos-arm64
          path: |
            apps/python/dist/*.zip
            artifacts/*-build.json
            artifacts/*-benchmark*.json
            artifacts/*-benchmark*.log
            artifacts/*-preview.png
            artifacts/*-opend-smoke.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: metrics-python
          path: artifacts/*-benchmark.json
          if-no-files-found: error
          retention-days: 14
  swift-cpp:
    name: SwiftUI + C++ SDK (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install CMake
        run: python3 -m pip install cmake==4.1.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/swift-cpp/thirdlib
          key: macos15-arm64-deps-${{ hashFiles('apps/swift-cpp/scripts/build-sdk.sh', 'apps/swift-cpp/vendor/**/ThirdLibSrc/*.tar.gz') }}
      - name: Build official SDK and pinned dependencies
        run: apps/swift-cpp/scripts/build-sdk.sh
      - name: Unit tests
        run: swift test --package-path apps/swift-cpp --filter 'BridgeTests|MarketTests'
      - name: Official SDK and UI integration tests
        run: swift test --package-path apps/swift-cpp --filter SDKIntegrationTests
      - name: OpenD updater tests
        run: swift test --package-path runtime
      - name: Real official OpenD download and update acceptance
        env:
          MOOMOO_OPEND_UPDATE_ACCEPTANCE: '1'
        run: swift test --package-path runtime --filter UpdateAcceptanceTests
      - name: Package application
        run: apps/swift-cpp/scripts/build-app.sh
      - name: Smoke test packaged app
        run: |
          mkdir -p artifacts
          python3 scripts/smoke-app.py apps/swift-cpp/dist/MooSwiftCpp.app artifacts/MooSwiftCpp-preview.png
          python3 scripts/smoke-opend.py apps/swift-cpp/dist/MooSwiftCpp.app artifacts/swift-cpp-opend-smoke.json
          python3 scripts/build-metrics.py apps/swift-cpp/dist/MooSwiftCpp.app > artifacts/swift-cpp-build.json
      - name: Benchmark packaged app (three trials)
        run: python3 scripts/benchmark-app.py apps/swift-cpp/dist/MooSwiftCpp.app artifacts/swift-cpp-benchmark.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MooSwiftCpp-macos-arm64
          path: |
            apps/swift-cpp/dist/*.zip
            artifacts/*-build.json
            artifacts/*-benchmark*.json
            artifacts/*-benchmark*.log
            artifacts/*-preview.png
            artifacts/*-opend-smoke.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: metrics-swift-cpp
          path: artifacts/*-benchmark.json
          if-no-files-found: error
          retention-days: 14

  comparison:
    name: Compare benchmark results
    needs: [python, swift-cpp]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: metrics-*
          path: artifacts/report-input
          merge-multiple: true
      - name: Test report validation
        run: python3 -m unittest discover -s tests/unit -v
      - name: Validate and compare measurements
        run: |
          python3 scripts/compare-benchmarks.py artifacts/report-input artifacts/comparison.md
          cat artifacts/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macOS-performance-comparison
          path: |
            artifacts/comparison.md
            artifacts/comparison.json
          if-no-files-found: error
          retention-days: 14
