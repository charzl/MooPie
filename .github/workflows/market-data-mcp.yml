name: Validate market data MCP
on:
  pull_request:
    paths: ['apps/python/moopython/market_*.py', 'apps/python/tests/mcp/**', 'apps/python/tests/unit/test_market_collection.py', 'apps/python/pyproject.toml', '.github/workflows/market-data-mcp.yml']
  push:
    branches: [main]
    paths: ['apps/python/moopython/market_*.py', 'apps/python/tests/mcp/**', 'apps/python/pyproject.toml', '.github/workflows/market-data-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install official MCP SDK
        run: python -m pip install 'mcp>=2.3,<3'
      - name: Test collection boundary without Qt or broker SDK
        env:
          PYTHONPATH: apps/python
        run: |
          python -m unittest discover -s apps/python/tests/unit -p test_market_collection.py -v
          python -m unittest discover -s apps/python/tests/mcp -v
          python -m moopython.market_data_cli --help
          python -m moopython.market_mcp --help
      - name: Download Apple Silicon MCP dependencies for offline installation
        run: |
          python -m pip download --only-binary=:all: --platform macosx_14_0_arm64 --python-version 3.14 --implementation cp --abi cp314 'mcp>=2.3,<3' --dest artifacts/mcp-dependencies
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcp-dependencies-macos-arm64
          path: artifacts/mcp-dependencies
          if-no-files-found: error
          retention-days: 7
