[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moomoo-rule-engine"
version = "0.1.0"
description = "Deterministic, versioned daily market screening for MooClients"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
moomoo-scan = "moomoo_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moomoo_rules = ["rules/*.json"]
